<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="EcoHarmony Park">
  <!-- Ícono de EcoHarmony Park: solo la vuelta al mundo, con los colores del logo -->

  <!-- Fondo -->
  <rect width="512" height="512" rx="112" fill="#FFFFFF"/>

  <!-- Patas de la estructura (verde medio) -->
  <g stroke="#6A994E" stroke-width="16" stroke-linecap="round">
    <line x1="256" y1="232" x2="176" y2="440"/>
    <line x1="256" y1="232" x2="336" y2="440"/>
  </g>

  <!-- Rueda (verde oscuro) -->
  <g fill="none" stroke="#386641" stroke-linecap="round">
    <circle cx="256" cy="232" r="150" stroke-width="13"/>
    <circle cx="256" cy="232" r="100" stroke-width="6" stroke="#A7C957"/>
    <g stroke-width="8">
      <line x1="106" y1="232" x2="406" y2="232"/>
      <line x1="256" y1="82" x2="256" y2="382"/>
      <line x1="149.9" y1="125.9" x2="362.1" y2="338.1"/>
      <line x1="149.9" y1="338.1" x2="362.1" y2="125.9"/>
    </g>
  </g>

  <!-- Cabinas colgando de la rueda (crema y verde claro, alternadas) -->
  <g stroke="#386641" stroke-width="5">
    <line x1="406" y1="232" x2="406" y2="242"/>
    <line x1="362.1" y1="338.1" x2="362.1" y2="348.1"/>
    <line x1="256" y1="382" x2="256" y2="392"/>
    <line x1="149.9" y1="338.1" x2="149.9" y2="348.1"/>
    <line x1="106" y1="232" x2="106" y2="242"/>
    <line x1="149.9" y1="125.9" x2="149.9" y2="135.9"/>
    <line x1="256" y1="82" x2="256" y2="92"/>
    <line x1="362.1" y1="125.9" x2="362.1" y2="135.9"/>
  </g>
  <g>
    <rect x="386" y="242" width="40" height="32" rx="9" fill="#F2E8CF" stroke="#386641" stroke-width="5"/>
    <rect x="342.1" y="348.1" width="40" height="32" rx="9" fill="#A7C957"/>
    <rect x="236" y="392" width="40" height="32" rx="9" fill="#F2E8CF" stroke="#386641" stroke-width="5"/>
    <rect x="129.9" y="348.1" width="40" height="32" rx="9" fill="#A7C957"/>
    <rect x="86" y="242" width="40" height="32" rx="9" fill="#F2E8CF" stroke="#386641" stroke-width="5"/>
    <rect x="129.9" y="135.9" width="40" height="32" rx="9" fill="#A7C957"/>
    <rect x="236" y="92" width="40" height="32" rx="9" fill="#F2E8CF" stroke="#386641" stroke-width="5"/>
    <rect x="342.1" y="135.9" width="40" height="32" rx="9" fill="#A7C957"/>
  </g>

  <!-- Eje central -->
  <circle cx="256" cy="232" r="22" fill="#BC4749" stroke="#386641" stroke-width="6"/>

  <!-- Pasto -->
  <line x1="120" y1="442" x2="392" y2="442" stroke="#386641" stroke-width="14" stroke-linecap="round"/>
</svg>
